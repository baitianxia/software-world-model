# Minimal iteration manifest consumed by scripts/plan_gate.py.
# Only plan_execution_control.current_action is enforced: id, kind, status,
# coding_allowed, allowed_change_paths and forbidden_change_paths.
schema_version: 2
iteration: ITER-NNN
plan_execution_control:
  schema: DEVELOPMENT_PLAN_EXECUTION_CONTROL@1
  plan_revision_ref: ITER-NNN-PROPOSAL
  current_action:
    id: ITER-NNN-ACTION-TASK-1
    owner_slice_ref: ITER-NNN-SLICE-001
    kind: product-development
    status: authorized
    coding_allowed: true
    external_execution_allowed: false
    allowed_change_paths:
      - src/software_world_model/**
      - tests/**
      - validation/**
      - docs/project/iterations/iteration-NNN/**
      - docs/project/current.md
      - docs/_generated/**
    forbidden_change_paths:
      - docs/system/
      - docs/project/governance/**
      - scripts/docs.py
      - scripts/plan_gate.py
# Governance work (system docs, governance docs, gate files) uses a separate
# current_action with kind: governance, then switches back.
