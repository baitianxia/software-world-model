direction_quality_gate:
  schema: VALUE_FIRST_FOUR_ARM_DIRECTION_GATE@1
  freeze_case_id: V-DIRECTION-FREEZE-NNN
  quality_case_id: V-DIRECTION-QUALITY-NNN
  owner_slice_ref: ITER-NNN-SLICE-NNN
  status: proposed-locked-until-direction-freeze-pass
  execution_order: direction-freeze-PASS->preferred-quality;preferred-quality-PASS->minimum-web;preferred-quality-FAIL->direction-rework;preferred-quality-INVALID->fallback-refreeze;fallback-refreeze-PASS->fallback-quality;fallback-refreeze-FAIL->preferred-quality;fallback-refreeze-INVALID->fallback-refreeze;fallback-quality-PASS->minimum-web;fallback-quality-FAIL->direction-rework;fallback-quality-INVALID->fallback-quality;minimum-web-PASS->user-direction-decision
  arms:
    - direct-relevant-evidence
    - same-agent-source-only
    - same-agent-world-model-and-source
    - current-codex
  minimum_question_count: 3
  question_count: <positive-integer-at-least-three>
  question_set_rule: system-purpose-or-entry,behavior-call-flow-and-material-side-effect,failure-authorization-or-unknown;at-least-two-unseen;no-pom-only-question
  source_truth_owner: independent-exact-source-ledger-not-any-model-answer
  source_truth_ledger_digest: <sha256-exact-independent-source-ledger>
  direct_evidence_arm_is_oracle: false
  direct_evidence_arm_generation_model_matches_system_arms: true
  current_codex_role: strong-external-baseline-not-oracle-not-adjudicator
  current_codex_is_oracle_or_reviewer: false
  current_codex_identity_digest: <sha256-exact-client-model-reasoning-tools-permissions-runtime>
  first_three_arms_same_provider_model_configuration: true
  source_only_and_world_model_arms_same_agent_prompt_tools_budget_cache_and_reviewer: true
  outputs_sealed_before_cross_arm_disclosure: true
  blind_randomized_independent_evaluation: true
  absolute_quality_pass_required: true
  absolute_quality_rule: zero-major-errors-material-omissions-unsupported-or-wrong-citations-false-limitations-or-boundary-errors
  world_model_arm_must_not_lose_to_direct_evidence: true
  world_model_arm_must_not_lose_to_source_only: true
  world_model_arm_must_not_lose_to_current_codex: true
  current_codex_overall_quality_margin_rule: strictly-positive
  non_locator_world_model_contribution_required: true
  all_tie_outcome: FAIL
  both_fail_unresolved_invalid_or_blinding_invalid_outcome: FAIL
  cost_or_latency_can_compensate_quality: false
  product_code_change_before_verdict_allowed: false
  web_change_before_verdict_allowed: false
  preferred_route_execution_profile_ref: <preferred-route-execution-profile-ref>
  fallback_route_execution_profile_ref: <fallback-route-execution-profile-ref>
  preferred_quality_action_id: ITER-NNN-ACTION-DIRECTION-QUALITY-PREFERRED-NNN
  preferred_quality_result_ref: ITER-NNN-RESULT-V-DIRECTION-QUALITY-PREFERRED-NNN
  mixed_provider_batch_allowed: false
  fallback_refreeze_action_id: ITER-NNN-ACTION-DIRECTION-FALLBACK-REFREEZE-NNN
  fallback_refreeze_case_id: V-DIRECTION-FALLBACK-REFREEZE-NNN
  fallback_refreeze_requires_new_human_authority: false
  fallback_refreeze_provider_dispatch_allowed: false
  fallback_refreeze_action_evidence_required: preferred-invalid-predecessor-seal,provider-neutral-root-input-set,fallback-execution-profile-ref-and-digest,fallback-admission-policy-plugin-ref-and-digest,no-mixed-batch,zero-provider-dispatch,no-new-human-authority
  fallback_quality_action_id: ITER-NNN-ACTION-DIRECTION-QUALITY-FALLBACK-NNN
  fallback_quality_result_ref: ITER-NNN-RESULT-V-DIRECTION-QUALITY-FALLBACK-NNN
  fallback_allowed_only_after_refreeze_pass: true
  fallback_admission_prerequisite_case_id: V-FALLBACK-ROUTE-ADMISSION-NNN
  fallback_quality_action_evidence_required: fallback-refreeze-predecessor-seal,provider-neutral-root-input-set,execution-profile-ref-and-digest,admission-and-terminal-receipts,no-mixed-batch
  quality_case_pass_result_cardinality: at-most-one
  preferred_terminal_unavailable_action: invalidate-preferred-batch-and-enter-pre-registered-fallback-refreeze
  preferred_other_invalid_action: fallback-refreeze-fails-back-to-preferred-quality
  fallback_invalid_action: fail-closed-at-fallback-quality
  target_product_commit: <exact-clean-product-commit>
  target_product_tree: <exact-clean-product-tree>
  dirty_candidate_allowed: false

# 当公开源码 standing authority 适用时，完整 umbrella Case 不是独立阶段；它由真实外部动作的
