schema_version: 2
iteration:
  id: ITER-NNN
  status: proposed
  outcome_scope: <complete-browser-engineering-chat-outcome>
  current_decision_ref: ITER-NNN-PDR-NNN
  coding_input: false

baseline:
  commit: <exact-git-commit>
  tree: <exact-git-tree>
  planning_commit: <exact-planning-git-commit>
  planning_tree: <exact-planning-git-tree>
  dirty_worktree_allowed: false
  relation: <exact-baseline-relation>

# Readiness 和用户授权完成前保持 proposed/coding_input=false。授权后把下面的
# current action、路径、Case 和 project/current.md 镜像一次性切为 exact 值。
plan_execution_control:
  schema: DEVELOPMENT_PLAN_EXECUTION_CONTROL@1
  plan_revision_ref: ITER-NNN-PDR-NNN
  enforcement_mode: fail-closed
  authorization_refs:
    - <exact-user-development-authorization-ref>
  current_action:
    id: ITER-NNN-ACTION-COMPLETE-EXPERIENCE-NNN
    owner_slice_ref: ITER-NNN-SLICE-NNN
    kind: complete-mvp-experience-development
    status: proposed
    case_id: V-MVP-EXPERIENCE-NNN
    coding_allowed: true
    external_execution_allowed: true
    result_ref: ITER-NNN-RESULT-V-MVP-EXPERIENCE-NNN
    result_path: docs/project/iterations/iteration-NNN/results/v-mvp-experience-NNN.md
    evidence_schema: DEVELOPMENT_PLAN_GATE_EVIDENCE@1
    evidence_path: docs/project/iterations/iteration-NNN/results/evidence/v-mvp-experience-NNN.json
    evidence_verifier: ITERNNN_MVP_HANDOFF@1
    runner_identity_paths:
      - scripts/plan_gate.py
      - validation/iteration_NNN_mvp/value_gate/runner.py
      - tests/test_iteration_NNN_mvp_value_gate.py
    produced_case_ids:
      - V-MVP-EXPERIENCE-NNN
    prerequisite_case_ids:
      - V-PUBLIC-SOURCE-AUTHORITY-NNN
    allowed_change_paths:
      - src/software_world_model/**
      - tests/**
      - validation/iteration_NNN_mvp/experience/**
      - pyproject.toml
      - README.md
      - docs/_generated/**
      - docs/system/**
      - docs/project/current.md
      - docs/project/iterations/iteration-NNN/**
    forbidden_change_paths:
      - validation/iteration_NNN_mvp/value_gate/**
      - tests/test_iteration_NNN_mvp_value_gate.py
      - scripts/plan_gate.py
      - docs/project/governance/**
      - docs/project/roadmap/**
      - docs/project/iterations/iteration-NNN/decisions/**
      - .githooks/**
      - .github/workflows/**
  transition:
    pass_next_action_id: ITER-NNN-ACTION-USER-DIRECTION-NNN
    fail_next_action_id: ITER-NNN-ACTION-USER-DIRECTION-NNN
    invalid_next_action_id: ITER-NNN-ACTION-USER-DIRECTION-NNN
  locks:
    product_code_changes: false
    prompt_or_reviewer_changes: false
    web_canary: false
    hardening: true
    full_regression: true
    provider_dispatch: false
  next_action_contracts:
    complete_experience:
      id: ITER-NNN-ACTION-COMPLETE-EXPERIENCE-NNN
      owner_slice_ref: ITER-NNN-SLICE-NNN
      kind: complete-mvp-experience-development
      status: proposed
      case_id: V-MVP-EXPERIENCE-NNN
      coding_allowed: true
      external_execution_allowed: true
      result_ref: ITER-NNN-RESULT-V-MVP-EXPERIENCE-NNN
      result_path: docs/project/iterations/iteration-NNN/results/v-mvp-experience-NNN.md
      evidence_schema: DEVELOPMENT_PLAN_GATE_EVIDENCE@1
      evidence_path: docs/project/iterations/iteration-NNN/results/evidence/v-mvp-experience-NNN.json
      evidence_verifier: ITERNNN_MVP_HANDOFF@1
      runner_identity_paths:
        - scripts/plan_gate.py
        - validation/iteration_NNN_mvp/value_gate/runner.py
        - tests/test_iteration_NNN_mvp_value_gate.py
      produced_case_ids:
        - V-MVP-EXPERIENCE-NNN
      prerequisite_case_ids:
        - V-PUBLIC-SOURCE-AUTHORITY-NNN
      allowed_change_paths:
        - src/software_world_model/**
        - tests/**
        - validation/iteration_NNN_mvp/experience/**
        - pyproject.toml
        - README.md
        - docs/_generated/**
        - docs/system/**
        - docs/project/current.md
        - docs/project/iterations/iteration-NNN/**
      forbidden_change_paths:
        - validation/iteration_NNN_mvp/value_gate/**
        - tests/test_iteration_NNN_mvp_value_gate.py
        - scripts/plan_gate.py
        - docs/project/governance/**
        - docs/project/roadmap/**
        - docs/project/iterations/iteration-NNN/decisions/**
        - .githooks/**
        - .github/workflows/**
      transition:
        pass_next_action_id: ITER-NNN-ACTION-USER-DIRECTION-NNN
        fail_next_action_id: ITER-NNN-ACTION-USER-DIRECTION-NNN
        invalid_next_action_id: ITER-NNN-ACTION-USER-DIRECTION-NNN
      locks:
        product_code_changes: false
        prompt_or_reviewer_changes: false
        web_canary: false
        hardening: true
        full_regression: true
        provider_dispatch: false
    user_direction:
      id: ITER-NNN-ACTION-USER-DIRECTION-NNN
      owner_slice_ref: ITER-NNN-SLICE-NNN
      kind: governance-user-direction-decision
      status: proposed
      case_id: V-PREVIEW-NNN
      coding_allowed: false
      external_execution_allowed: false
      result_ref: ITER-NNN-RESULT-V-USER-DIRECTION-NNN
      result_path: docs/project/iterations/iteration-NNN/results/v-user-direction-NNN.md
      evidence_schema: DEVELOPMENT_PLAN_GATE_EVIDENCE@1
      evidence_path: docs/project/iterations/iteration-NNN/results/evidence/v-user-direction-NNN.json
      evidence_verifier: ITERNNN_MVP_HANDOFF@1
      runner_identity_paths:
        - scripts/plan_gate.py
        - validation/iteration_NNN_mvp/value_gate/runner.py
        - tests/test_iteration_NNN_mvp_value_gate.py
      produced_case_ids:
        - V-PREVIEW-NNN
      prerequisite_case_ids:
        - V-MVP-EXPERIENCE-NNN
      allowed_change_paths:
        - docs/project/current.md
        - docs/project/iterations/iteration-NNN/**
        - docs/system/**
        - docs/project/governance/**
        - docs/_generated/**
      forbidden_change_paths:
        - src/software_world_model/**
        - validation/**
        - .githooks/**
        - .github/workflows/**
      transition:
        pass_next_action_id: ITER-NNN-ACTION-USER-DIRECTION-NNN
        fail_next_action_id: ITER-NNN-ACTION-USER-DIRECTION-NNN
        invalid_next_action_id: ITER-NNN-ACTION-USER-DIRECTION-NNN
      locks:
        product_code_changes: true
        prompt_or_reviewer_changes: true
        web_canary: true
        hardening: true
        full_regression: true
        provider_dispatch: true

# 比较发生在首次可操作浏览器交付之后。它决定能否进入方向确认后的夯实，
# 但不是第一次体验的前置动作或产品代码锁。同一 standing scope 内的后续
# 工作只调整工作计划；只有真实 scope delta 才需要新的授权决定。
direction_quality_gate:
  schema: POST_EXPERIENCE_STRONG_BASELINE_GATE@1
  case_id: V-DIRECTION-QUALITY-NNN
  owner_slice_ref: ITER-NNN-SLICE-NNN
  status: post-experience-quality-policy-not-current-action
  execution_order: first-operable-browser-delivery->heterogeneous-current-codex-comparison->final-experience-result-handoff->user-direction
  system_arm: complete-world-model-system
  baseline_arm: actual-current-codex
  minimum_question_count: 3
  minimum_unseen_question_count: 2
  question_set_rule: heterogeneous-real-engineering-questions-no-single-artifact-only-suite
  source_truth_owner: independent-exact-source-evidence-not-any-model-answer
  current_codex_role: strong-external-baseline-not-oracle-not-adjudicator
  fresh_isolated_answers_sealed_before_cross_arm_disclosure: true
  independent_blind_evaluation: true
  system_absolute_quality_pass_required: true
  no_material_per_question_loss_allowed: true
  current_codex_overall_quality_margin_rule: strictly-positive
  non_locator_world_model_contribution_required: true
  tie_or_unresolved_outcome: FAIL
  cost_or_latency_can_compensate_quality: false
  first_browser_handoff_precedes_gate_completion: true
  blocks_first_experience_handoff: false
  blocks_direction_pass_and_hardening: true
  full_four_arm_causal_ablation_requires_user_continue: true

product_goal_alignment:
  target_ref: SYS-PRODUCT-SUCCESS
  baseline_gap: <exact-current-user-visible-gap>
  accepted_capability_refs:
    - <accepted-result-ref>
  new_capability_slice_refs:
    - ITER-NNN-SLICE-NNN
  end_of_iteration_web_capability: <exact-complete-browser-chat-capability>
  next_blocking_gap: <next-unproved-capability>
  first_operable_browser_delivery_case_id: V-CHAT-EXPERIENCE-NNN
  final_experience_handoff_case_id: V-MVP-EXPERIENCE-NNN
  direction_quality_case_id: V-DIRECTION-QUALITY-NNN
  direction_preview_case_id: V-PREVIEW-NNN
  user_direction_owner: user
  allowed_direction_decisions: CONTINUE,REWORK,REDIRECT,REJECT
  hardening_requires_continue: true
  full_regression_requires_continue: true
  hidden_evaluation_requires_continue: true
  four_arm_causal_ablation_requires_continue: true
  cross_project_evaluation_requires_continue: true
  current_codex_role: strong-external-baseline-not-oracle-not-adjudicator

experience_binding:
  schema: ENGINEERING_CHAT_EXPERIENCE@1
  case_id: V-CHAT-EXPERIENCE-NNN
  exact_version_required: true
  repeatable_start_required: true
  fixed_loopback_address: <http://127.0.0.1:PORT/>
  unauthenticated_local_browser: true
  world_model_cognition_in_answer_chain: true
  controlled_read_only_source_tools: true
  evidence_and_citations: true
  independent_review: true
  semantic_follow_up: true
  user_correction_updates_context: true
  summary_honors_current_context: true
  new_conversation_context_isolation: true
  limitations_visible: true
  turn_failure_scope: current-turn-only-conversation-remains-usable
  handoff_rule: first-complete-browser-main-chain-is-immediately-user-visible
  comparison_uses_same_candidate: true

experience_delivery_policy:
  schema: EXPERIENCE_FIRST_DELIVERY@1
  owner_slice_ref: ITER-NNN-SLICE-NNN
  first_operable_browser_delivery_case_id: V-CHAT-EXPERIENCE-NNN
  first_operable_browser_delivery_requires_result: false
  first_operable_browser_delivery_moves_plan_cursor: false
  first_operable_browser_delivery_requires_current_codex_comparison: false
  final_experience_handoff_case_id: V-MVP-EXPERIENCE-NNN
  final_experience_handoff_requires_result: true
  final_experience_handoff_moves_plan_cursor: true
  final_experience_handoff_success_path_requires_current_codex_comparison: true
  final_experience_handoff_failure_path_requires_one_general_repair_still_failed: false
  final_experience_handoff_alternate_trigger: none-ordinary-failure-remains-in-product-build
  direction_confirmation_case_id: V-PREVIEW-NNN
  micro_checkpoint_count: 2
  micro_checkpoint_order: first-operable-browser-delivery->same-candidate-quality-comparison->final-experience-result-handoff->user-direction
  direction_receipt_records_decision_only: true
  direction_action_self_loop_until_new_pdr_cutover: false
  continue_unlock_requires_new_pdr: false
  continue_unlock_requires_explicit_user_authorization: false
  continue_unlock_requires_trusted_parent_cutover: false
  local_message_digest_is_platform_authenticated_authority: false

development_policy:
  action_unit: one-long-running-complete-experience-action
  ordinary_commits_within_action_allowed: true
  ordinary_failures_remain_in_current_action: true
  result_required_for: final-direction-completion-or-real-project-state-migration
  first_operable_browser_delivery_requires_result: false
  result_for_each_commit_test_failure_or_dispatch: false
  activation_clock_allowed: false
  minute_legality_gate_allowed: false
  whole_manifest_digest_gate_allowed: false
  pre_first_experience_tests: targeted-impact,startup,safety,failure-truthfulness
  full_regression_before_user_continue_allowed: false
  hidden_before_user_continue_allowed: false
  hardening_before_user_continue_allowed: false
  provider_call_count_can_reduce_quality: false

failure_attribution_policy:
  schema: EARLIEST_DIVERGENCE_ROOT_CAUSE@1
  ordered_layers: source-truth,world-model-cognition,conversation-task-understanding,agent-work-state-plan,tool-observation-evidence,answer,independent-review,web
  falsifiable_hypothesis_required_before_change: true
  question_specific_logic_allowed: false
  repair_scope: evidence-driven-general-repairs-in-current-action
  targeted_recheck_requires_unseen_adjacent_cases: 2
  live_canary_after_local_recheck_maximum: per-evidence-backed-hypothesis
  repeated_signature_after_one_repair_action: recheck-earliest-divergence-and-owner-without-stopping-product-build

authorization_continuation_policy:
  schema: AUTHORIZATION_CONTINUITY@1
  standing_authority_schema: PUBLIC_SOURCE_MODEL_STANDING_AUTHORITY@1
  standing_authority_ref: <exact-human-authority-ref>
  standing_scope_digest: <sha256-exact-standing-scope>
  standing_scope_covers_new_run_question_conversation_turn: true
  redundant_human_authorization_within_scope_forbidden: true
  one_use_runtime_receipt_required_for_each_external_dispatch: true
  receipt_required_before: source-disclosure,network,credential
  receipt_can_create_or_expand_authority: false
  scope_mismatch_action: fail-closed-before-external-dispatch
  true_scope_delta_requires_exact_human_grant: true
  scope_delta_examples: private-or-unknown-or-dirty-source,source-or-revision-policy-drift,new-recipient-or-route,budget-increase,external-write,non-loopback,production
  approval_continuation: auto-resume-without-repeat-confirmation

standing_external_authority:
  schema: PUBLIC_SOURCE_MODEL_STANDING_AUTHORITY@1
  authority_ref: <exact-human-authority-ref>
  canonical_public_sources: <source-list>
  license_and_publicness_record: <exact-record-ref>
  revision_selection_policy: <approved-policy>
  exact_runtime_revision_required: true
  clean_worktree_required: true
  read_only_allowlist_required: true
  route_scope: <approved-provider-role-endpoint-account-classes>
  budget_scope: <calls-tokens-duration>
  schedule_scope: <approved-schedule-or-always>
  validity_and_revocation: <exact-boundary>
  sink: loopback-EVALUATION_ONLY
  external_write_allowed: false
  production_allowed: false

provider_route_policy:
  schema: PROVIDER_TRANSPARENT_ROUTE@1
  preference_order: preferred,fallback
  configured_identities_live_only_in_execution_profiles_and_receipts: true
  same_logical_interaction_uses_one_complete_route_attempt_at_a_time: true
  fallback_requires_authorized_profile_and_runtime_admission: true
  fallback_restarts_from_original_input_and_exact-cognition-context: true
  cross_attempt_intermediate_artifact_reuse_allowed: false
  user_resubmission_required: false
  capability_failure_must_not_be_misclassified_as_network_unavailable: true
  application_source_or_security_failure_allows_route_fallback: false
  independent_review_cannot_be_skipped: true
  cost_can_reduce_answer_quality: false

verification_policy:
  final_experience_handoff_verifier_scope: complete-chain-browser-chat-evidence-review-isolation-heterogeneous-comparison-summary-and-test-boundaries
  verifier_must_not_duplicate_product_workflow: true
  runner_frozen_before_result: true
  candidate_runner_cannot_verify_itself: true
  targeted_tests_before_first_handoff: true
  full_regression_after_continue_before_acceptance: true
  hidden_after_continue_before_acceptance: true
