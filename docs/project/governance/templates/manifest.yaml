schema_version: 1
iteration:
  id: ITER-NNN
  status: proposed
  outcome_scope: <scope>

baseline:
  commit: <exact-git-commit>
  dirty_worktree_allowed: false

product_goal_alignment:
  target_ref: SYS-PRODUCT-SUCCESS
  capability_path_ref: <roadmap-milestone-id>
  capability_path_step: <current-step-id>
  predecessor_result_refs: []
  critical_assumption_ids: <comma-separated-A-number-ids>
  # Proposal 的 exact Critical assumptions section；Readiness 接受前替换为真实摘要，禁止开发后改写假设原文。
  critical_assumption_catalog_digest: <sha256-exact-proposal-assumption-catalog>
  end_of_iteration_web_capability: <user-visible-capability-if-accepted>
  next_blocking_gap: <next-earliest-unproved-capability>
  baseline_gap: <current-general-source-qa-gap>
  accepted_capability_refs: []
  new_capability_slice_refs: []
  held_out_free_question_delta: <measurable-before-and-after>
  # 输入保管与技术裁决分离：用户可持有未公开问题；独立评测方裁决质量，用户只做方向/接受决定。
  held_out_input_owner: <user-or-independent-evaluator>
  held_out_evaluation_owner: independent-evaluator
  visible_development_corpus_digest: <sha256-or-not-frozen-requires-slice-001-authorization>
  alpha_visible_development_corpus_digest: <sha256-or-not-frozen-requires-slice-002-authorization>
  implementation_question_visibility: hidden
  implementation_project_identity_and_source_visibility: hidden-until-product-code-freeze
  evaluation_project_manifest_digest: <sha256-exact-project-and-version-manifest>
  held_out_suite_digest: <sha256-evaluator-owned-suite>
  baseline_result_digest: <sha256-exact-baseline-result>
  mature_source_agent_protocol_digest: <sha256-exact-comparison-protocol>
  mature_source_agent_rubric_digest: <sha256-exact-rubric-and-adjudication-policy>
  # 从下一份新产品 Iteration 起，current Codex 是强外部基线，不是 Oracle 或裁判；identity digest 必须覆盖实际
  # client/binary/model/reasoning/tools/permissions/source-scope/revision/questions/run-time identity。
  mature_source_agent_identity_digest: <sha256-exact-current-codex-identity>
  mature_source_agent_role: strong-external-baseline-not-oracle-not-adjudicator
  mature_source_agent_execution_mode: fresh-isolated-same-question-answer-sealed-before-disclosure
  secondary_metrics_can_compensate_answer_quality: false
  positive_value_metric: blind-paired-answer-quality-margin
  positive_value_unit: quality-basis-points
  positive_value_comparison: at-least
  positive_value_threshold: <positive-integer-at-least-one>
  positive_value_reuse_horizon_questions: <positive-integer>
  mature_source_agent_cache_policy_digest: <sha256-exact-baseline-cache-policy>
  positive_value_protocol_digest: <sha256-exact-formula-input-and-replay-protocol>
  positive_value_freeze_receipt_ref: <codex-user-message-sha256>
  positive_value_adjudication_owner: independent-evaluator
  authorized_software_sources_digest: <sha256-source-scope-including-code-doc-config>
  held_out_question_count: <positive-integer>
  held_out_answerable_question_count: <positive-integer>
  held_out_boundary_question_count: <positive-integer>
  held_out_answerable_without_symbol_count_minimum: <positive-integer>
  held_out_answerable_without_symbol_per_project_minimum: <positive-integer>
  held_out_baseline_supported_count: <non-negative-integer>
  held_out_target_supported_count: <higher-integer>
  supported_count_denominator: answerable-only
  boundary_gap_counted_as_supported: false
  # verification case IDs, for example V-XD-001
  # new_capability_slice_refs 的顺序也是 Slice 授权顺序；后续 Slice 保持 proposed，直到前序完成并再次获得明确授权。
  cross_domain_cases: []
  # 完成前必须全部 PASS 且绑定 Result Evidence 的 Verification Case。
  blocking_case_ids: []
  # 首个 Slice 获得授权前就必须 PASS 的独立阻断 Case；不放入由 Slice Result 持有的 blocking_case_ids。
  readiness_blocking_case_ids: []
  cross_domain_case_count: <positive-integer>
  cross_domain_bindings:
    binding_001:
      case_id: <V-XD-NNN>
      accepted_capability_ref: <prior-acceptance-id>
      new_slice_ref: <current-slice-id>
  first_product_web_checkpoint: <verification-case-id>
  direction_preview_checkpoint: <V-PREVIEW-NNN>
  direction_preview_binding:
    case_id: <V-PREVIEW-NNN>
    web_case_id: <V-EXPERIENCE-NNN>
    new_slice_ref: <first-experience-slice-id>
    real_product_entry: <entrypoint>
    representative_task_count: <small-diverse-positive-integer>
    status_label: non-acceptance-non-production
    decision_owner: <user-or-product-owner>
    allowed_decisions: CONTINUE,REWORK,REDIRECT,REJECT
    hardening_requires_continue: true
  web_checkpoint_binding:
    case_id: <V-WEB-NNN>
    new_slice_ref: <current-slice-id>
    executes_cross_domain_case_id: <V-XD-NNN>
  experience_version_binding:
    schema: USER_EXPERIENCE_VERSION@1
    case_id: <V-EXPERIENCE-NNN>
    new_slice_ref: <first-user-visible-slice-id>
    exact_version_visible: true
    repeatable_start: true
    fixed_loopback_address: <http://127.0.0.1:port>
    continuous_same_session_free_questions: true
    limitations_visible: true
    question_failure_scope: current-question-only-service-remains-available
  # 与首个持续 Web Alpha 同出口的小样本 current Codex 盲评；不是体验前的新阶段，完整 hidden 复验仍在 hardening/final。
  alpha_agent_comparison_binding:
    case_id: <V-COMP-ALPHA-NNN>
    new_slice_ref: <first-sustained-web-alpha-slice-id>
    question_count: <positive-integer-at-least-three>
    post_freeze_live_question_count: <positive-integer-at-least-one-and-no-greater-than-question-count>
    question_set_rule: original-failure-plus-two-heterogeneous-including-post-freeze-live
    protocol_digest_ref: mature_source_agent_protocol_digest
    rubric_digest_ref: mature_source_agent_rubric_digest
    identity_digest_ref: mature_source_agent_identity_digest
    pass_rule: system-absolute-pass-no-per-question-regression-and-positive-blind-quality-margin
    all_tie_outcome: FAIL
    secondary_metric_compensation_allowed: false
  # 可选：后续 Slice 的正式 Web checkpoint；每项必须绑定同一 Slice 的跨域 Case。
  additional_web_checkpoint_bindings: {}
  # 只有体验 Alpha CONTINUE 后的适用 hardening Slice 才绑定独立持有的 early hidden canary；首次体验不得被 hidden 阻断。
  # 每项冻结问题总数、answerable、两类互补 boundary 和关联的 early negative Case。
  early_hidden_canary_bindings: {}
  # 首个适用 hardening Slice 把同一 canary 绑定到扩大后的成熟替代方案对照和逐层诊断；不得复用 Alpha Result 代替。
  early_comparison_binding: {}
  early_diagnostic_binding: {}
  # 每个 Slice 恰好一个。PASS 只表示复盘完成；success_decision 才表示方案可继续或可接受。
  reflection_gate_bindings:
    slice_001:
      case_id: <V-REFLECT-NNN>
      new_slice_ref: <current-slice-id>
      # 本 Slice 已到期且成功时必须全部 SUPPORTED 的有序子集；后续只能增加，最终 Slice 必须覆盖全部 critical_assumption_ids。
      assumption_ids: <ordered-due-assumption-subset>
      # 每个尚未到期的假设都必须绑定一个本 Slice 的 early blocking Case；若该 Case FAIL，blocked Result 必须追加结构化 Verdict 行。
      conditional_falsifier_bindings: {}
      success_decision: <CONTINUE-or-ACCEPT>
      decision_owner: <independent-product-architecture-quality-owner>
      required_before_next_authorization_or_acceptance: true
  live_ad_hoc_question_checkpoint: <verification-case-id>
  live_ad_hoc_checkpoint_binding:
    case_id: <V-ADHOC-NNN>
    new_slice_ref: <current-slice-id>
    executes_cross_domain_case_id: <V-XD-NNN>
  live_ad_hoc_question_count: <positive-integer>
  live_ad_hoc_without_symbol_count_minimum: <positive-integer>
  stop_or_redirect_conditions: []

rework_policy:
  schema: SAME_SLICE_REWORK@1
  failed_attempt_default_decision: REWORK
  failed_attempt_blocks: slice-promotion-only
  same_slice_reauthorization_allowed: true
  problem_report_or_review_request_implies_redirect: false
  redirect_bases: explicit-user-direction-change,core-architecture-falsified,precommitted-no-progress-limit-reached
  no_progress_measure: <measurable-quality-or-user-capability-delta>
  no_progress_attempt_limit: <positive-integer-at-least-two>

# 从 ITER-012 起强制；ITER-010 可显式 opt in。计时从授权后的第一次产品代码变更开始，
# availability/access 与答案 quality 分开；quality PASS 仍是 hardening 前置。
experience_delivery_policy:
  schema: EXPERIENCE_FIRST_DELIVERY@1
  owner_slice_ref: <first-sustained-web-alpha-slice-id>
  access_case_id: <V-ALPHA-ACCESS-NNN>
  timebox_case_id: <V-TIMEBOX-NNN>
  quality_case_id: <blocking-answer-quality-case-id>
  start_event: first-product-code-change-after-slice-authorization
  page_launchable_deadline_minutes: 60
  sustained_user_operable_alpha_deadline_minutes: 180
  hard_stop_deadline_minutes: 240
  hard_stop_action: stop-scope-expansion-and-external-calls-narrow-and-review
  access_gate_scope: user-operable-web-and-request-path-only
  quality_gate_scope: user-visible-answer-quality-only
  access_pass_cannot_satisfy_quality_gate: true
  availability_requires_quality_pass: false
  hardening_requires_quality_pass: true
  pre_first_experience_allowed_checks: targeted-impact-startup-safety-failure-truth-one-qualification-one-smoke-only
  pre_first_experience_qualification_limit: 1
  pre_first_experience_smoke_question_limit: 1
  pre_first_experience_full_regression_allowed: false
  live_attempt_unit: one-sealed-version-question-run-reaching-any-external-dispatch
  same_failure_signature_retry_limit: 1
  consecutive_no_user_visible_increment_limit: 2
  no_increment_action: stop-external-reruns-and-return-to-local-diagnosis
  failure_diagnosis_order: source-truth-world-model-cognition-question-understanding-investigation-evidence-package-answer-review-web
  earliest_divergence_required: true
  falsifiable_root_cause_hypothesis_required_before_prompt_schema_or_contract_change: true
  local_minimal_reproduction_required_before_live_retry: true
  unseen_adjacent_local_case_count: 2
  live_canary_question_count_after_local_pass: 1
  same_failure_signature_fix_limit_before_architecture_responsibility_review: 1
  same_failure_signature_recurrence_action: stop-rule-accumulation-and-review-architecture-responsibilities
  pre_first_experience_test_scope: targeted-impact-startup-and-safety-only
  full_regression_before_alpha_continue_allowed: false
  full_regression_allowed_stages: alpha-continue-hardening-and-before-formal-acceptance

# Session 开始前密封 Ark→DeepSeek ordered route 和双方 disclosure scope。用户只提交一个 logical question；
# fallback 是内部独立 provider attempt，不要求重提，不混用两个 attempt 的中间产物，也不因成本删减完整质量链。
provider_route_policy:
  schema: QUALIFIED_PROVIDER_PREFERENCE@1
  preference_order:
    - VOLCENGINE_ARK
    - DEEPSEEK
  primary_provider: VOLCENGINE_ARK
  fallback_provider: DEEPSEEK
  fallback_requires_primary_attempt_terminal_without_authorized_answer: true
  primary_unavailable_evidence_required: true
  implementation_gap_counts_as_primary_unavailable: false
  primary_availability_requires: credential-reference-configured-current-exact-conformance-current-exact-strategy-capability-qualification-and-no-active-provider-account-or-model-hold
  fallback_trigger: sealed-primary-attempt-terminal-without-authorized-answer-for-provider-or-model-capability-reason
  fallback_eligible_outcomes:
    - provider-unavailable
    - provider-http-error
    - provider-outcome-unknown
    - provider-output-invalid
    - model-review-rejected
  application_source_security_failure_allows_fallback: false
  fallback_reason_classification_required: true
  capability_failure_must_not_be_misclassified_as_unavailable: true
  route_freeze_time: before-session-start-and-before-any-question-dispatch
  ordered_routes_preauthorized_at_session_start: true
  ordered_route_disclosure_scopes_preauthorized_at_session_start: true
  transparent_logical_question_fallback_allowed: true
  user_resubmission_or_new_session_required: false
  fallback_attempt_restarts_full_chain: true
  fallback_attempt_inputs: immutable-original-question-and-exact-cognition-context
  cross_attempt_intermediate_state_reuse_allowed: false
  late_primary_result_policy: quarantine-audit-only
  late_primary_result_overwrite_allowed: false
  maximum_fallback_provider_attempts: 1
  same_provider_retry_allowed: false
  outcome_unknown_duplicate_cost_risk_recorded: true
  post_dispatch_provider_switch_requires: new-provider-attempt-under-same-logical-question-and-preauthorized-route
  deepseek_batch_start_policy: provider-declared-non-peak-preferred
  deepseek_schedule_timezone: Asia/Shanghai
  deepseek_current_preferred_windows:
    - "00:00-09:00"
    - "12:00-14:00"
    - "18:00-24:00"
  deepseek_schedule_source: https://api-docs.deepseek.com/quick_start/pricing/
  deepseek_schedule_checked_at: <ISO-date-checked-before-authorization>
  deepseek_schedule_effective_status: <announced-not-yet-effective-or-effective>
  peak_urgent_override_requires: audited-explicit-override
  cost_can_reduce_answer_quality: false
  cost_gate_scope: before-question-start-only
  current_started_question_must_keep_full_quality_chain: true
  unchanged_current_conformance_reuse_required: true

source_scope:
  provider: <provider-id>
  content_kind: <content-kind>
  contract_ref: <current-system-contract-id>
  authorized_software_sources_digest: <same-as-product-goal-alignment>
  question_or_suite_driven_update_allowed: false
  verification_case_ids: []

answer_protocol:
  contract_ref: <current-system-contract-id>
  mode: bounded-result-driven-world-model-investigation
  max_investigation_steps: <positive-integer>
  max_investigation_model_calls: <positive-integer>
  planner_model_call_upper_bound: <same-positive-integer>
  max_query_bytes_per_step: <positive-integer>
  max_result_bytes_per_step: <positive-integer>
  max_total_query_bytes_per_question: <positive-integer-at-least-per-step>
  max_total_result_bytes_per_question: <positive-integer-at-least-per-step>
  max_wall_time_milliseconds_per_question: <positive-integer>
  max_support_items_per_question: <positive-integer>
  max_trace_bytes_per_question: <positive-integer>
  budget_exhaustion_behavior: fail-closed-with-explicit-limitation
  draft_model_calls: 1
  independent_reviewer_model_calls: 1
  deterministic_schema_grounding_and_authorization_checks: true
  retries_allowed: false
  total_model_call_upper_bound_per_question: <planner-upper-bound-plus-two>
  status: pending

readiness_inputs:
  required_system_contract_refs: []
  source_semantics_contract_ref: pending
  implementation_query_contract_ref: pending
  no_payload_contract_ref: pending
  answer_protocol_contract_ref: pending
  system_contract_set_digest: pending
  java_frontend:
    artifact_ref: pending
    version: pending
    license_ref: pending
    offline_artifact_digest: pending
    canonicalization_oracle_digest: pending
    information_preservation_oracle_digest: pending
    information_boundary_oracle_digest: pending
  hidden_freeze_protocol_digest: pending
  hidden_freeze_receipt_ref: not-authorized

development:
  slices:
    ITER-NNN-SLICE-001:
      status: proposed
      coding_input: false
      result: not-executed
      rework_result_refs: []
      rework_prerequisite_result: none
      reflection_decision: not-executed
      reflection_prerequisite_result: <none-first-slice-or-not-executed>
      product_code_freeze_digest: not-executed
      authorized_by: not-authorized
      authorized_at: not-authorized
      authorization_ref: not-authorized

system_inputs:
  ids: []

external_inputs: []

verification:
  matrix_id: ITER-NNN-VERIFICATION
  evidence_location: var/<iteration>

authorization:
  readiness_review_id: ITER-NNN-READINESS
  authorized_by: pending
  authorized_at: pending
  authorization_ref: pending
  active_slice: none
