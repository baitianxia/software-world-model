[project]
name = "software-world-model"
version = "0.2.0"
description = "Software World Model modular monolith"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-java==0.23.5",
]

[project.scripts]
swm = "software_world_model.interface.cli:main"
swm-http = "software_world_model.interface.http_api:main"
swm-browser = "software_world_model.interface.http_api:main"
swm-provider = "software_world_model.interface.provider_cli:main"
swm-deepseek-provider = "software_world_model.interface.deepseek_provider_cli:main"
swm-read-set-catalog = "software_world_model.interface.read_set_catalog_cli:main"
swm-world-model = "software_world_model.interface.world_model_http:main"
swm-engineering-qa = "software_world_model.interface.engineering_qa_preview_cli:main"
swm-jwt-evaluation = "validation.jwt_iteration_001.cli:main"

[tool.unittest]
start-directory = "tests"
